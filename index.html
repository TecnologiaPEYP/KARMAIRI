<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kar Mai Rí — Cocina & Tragos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#efe4cd;
    --cream-deep:#e6d8b9;
    --ink:#2c2115;
    --ink-soft:#4a3a26;
    --terracotta:#a8532f;
    --terracotta-deep:#8e4326;
    --terracotta-line:#c98a5f;
    --gold:#c79a4b;
    --cream-line:#8d7a52;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Cormorant Garamond', serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    height:100vh;
    width:100vw;
    display:flex;
    flex-direction:row;
  }
  .panel{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    overflow:hidden;
    transition:flex 0.65s cubic-bezier(.22,.61,.36,1);
  }
  .stage:hover .panel.is-dim{ flex:0.82; }
  .stage:hover .panel.is-lit{ flex:1.22; }

  .panel--cocina{
    background:
      radial-gradient(ellipse at 20% 15%, rgba(199,154,75,0.16), transparent 55%),
      var(--cream);
    color:var(--ink);
  }
  .panel--bebidas{
    background:
      radial-gradient(ellipse at 80% 85%, rgba(255,200,150,0.14), transparent 55%),
      var(--terracotta);
    color:var(--cream);
  }

  .panel-frame{
    position:absolute;
    inset:18px;
    border:1px solid;
    pointer-events:none;
  }
  .panel--cocina .panel-frame{ border-color:rgba(44,33,21,0.35); }
  .panel--bebidas .panel-frame{ border-color:rgba(239,228,205,0.4); }

  .panel-content{
    position:relative;
    text-align:center;
    padding:0 8%;
    transform:translateY(0);
    transition:transform 0.65s cubic-bezier(.22,.61,.36,1);
  }
  .stage:hover .panel.is-dim .panel-content{ transform:translateY(6px); opacity:0.75; }
  .stage:hover .panel.is-lit .panel-content{ transform:translateY(-4px); }

  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:clamp(0.85rem, 1vw, 1.05rem);
    letter-spacing:0.12em;
    opacity:0.72;
    margin-bottom:0.6rem;
  }

  .panel-title{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(2.6rem, 6.4vw, 5.2rem);
    line-height:0.98;
    letter-spacing:-0.01em;
  }

  .panel-sub{
    margin-top:1.1rem;
    font-size:clamp(1.05rem, 1.3vw, 1.3rem);
    font-style:italic;
    opacity:0.8;
    max-width:26ch;
    margin-left:auto;
    margin-right:auto;
    line-height:1.35;
  }

  .enter{
    margin-top:2.2rem;
    display:inline-flex;
    align-items:center;
    gap:0.55rem;
    font-size:0.95rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-family:'Cormorant Garamond', serif;
    padding-bottom:3px;
    border-bottom:1px solid currentColor;
    opacity:0.85;
  }
  .enter::after{
    content:'—';
    transition:margin-left 0.35s ease;
  }
  .panel:hover .enter::after{ margin-left:4px; }

  /* seal */
  .seal{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:clamp(120px,13vw,168px);
    height:clamp(120px,13vw,168px);
    border-radius:50%;
    background:var(--cream);
    border:1px solid rgba(44,33,21,0.35);
    box-shadow:0 6px 30px rgba(44,33,21,0.25);
    pointer-events:none;
    text-align:center;
    padding:10px;
  }
  .seal-mark{
    font-family:'Playfair Display', serif;
    font-size:clamp(1.15rem,1.7vw,1.55rem);
    color:var(--ink);
    letter-spacing:0.02em;
    line-height:1.05;
  }
  .seal-mark i{ font-style:italic; font-weight:500; display:block; font-size:0.62em; color:var(--terracotta-deep); }
  .seal-sub{
    margin-top:4px;
    font-size:0.56rem;
    letter-spacing:0.24em;
    color:var(--ink-soft);
  }

  .divider-line{
    position:absolute;
    top:0; bottom:0; left:50%;
    width:1px;
    background:rgba(44,33,21,0.15);
    z-index:2;
  }

  footer{
    position:fixed;
    bottom:16px;
    left:0; right:0;
    text-align:center;
    font-size:0.72rem;
    letter-spacing:0.14em;
    color:rgba(44,33,21,0.4);
    z-index:1;
    pointer-events:none;
  }

  @media (max-width: 720px){
    .stage{ flex-direction:column; }
    .stage:hover .panel.is-dim{ flex:1; }
    .stage:hover .panel.is-lit{ flex:1; }
    .divider-line{ display:none; }
    .seal{ width:100px; height:100px; }
    .panel-content{ padding:0 10%; }
  }
</style>
</head>
<body>

<div class="stage">
  <a class="panel panel--cocina is-dim" href="menu-cocina.pdf" target="_blank" rel="noopener" onmouseenter="setLit(this)" onmouseleave="resetLit()">
    <div class="panel-frame"></div>
    <div class="panel-content">
      <div class="eyebrow">Kar Mai Rí</div>
      <div class="panel-title">Cocina</div>
      <p class="panel-sub">Sabores del Caribe, de mar a mesa</p>
      <span class="enter">Ver menú</span>
    </div>
  </a>

  <div class="divider-line"></div>

  <a class="panel panel--bebidas is-dim" href="menu-bebidas.pdf" target="_blank" rel="noopener" onmouseenter="setLit(this)" onmouseleave="resetLit()">
    <div class="panel-frame"></div>
    <div class="panel-content">
      <div class="eyebrow">Kar Mai Rí</div>
      <div class="panel-title">Bebidas</div>
      <p class="panel-sub">Coctelería, vinos y destilados</p>
      <span class="enter">Ver menú</span>
    </div>
  </a>

  <div class="seal">
    <div class="seal-mark">Kar Mai Rí<i>cocina & tragos</i></div>
  </div>
</div>

<footer>Centro Histórico · Cartagena de Indias</footer>

<script>
  const panels = document.querySelectorAll('.panel');
  function setLit(el){
    panels.forEach(p => {
      if(p === el){ p.classList.add('is-lit'); p.classList.remove('is-dim'); }
      else { p.classList.add('is-dim'); p.classList.remove('is-lit'); }
    });
  }
  function resetLit(){
    panels.forEach(p => { p.classList.remove('is-lit'); p.classList.add('is-dim'); });
  }
</script>

</body>
</html>
