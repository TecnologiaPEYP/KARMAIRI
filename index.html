<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KarMaiRi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#170b09}
body{overflow:hidden}
.hero{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:600px;
  margin:auto;
  overflow:hidden;
}
.contenido{
  position:absolute;
  inset:0;
  z-index:2;
  text-align:center;
  color:#f7eee4;
}
.fondo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
}
.contenido{
  position:absolute;
  inset:0;
  z-index:2;
  text-align:center;
  color:#f7eee4;
}
.logo{
  margin:0;
  padding-top:76px;
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:38px;
  font-weight:400;
  line-height:.9;
  letter-spacing:3px;
}
.logo small{
  display:block;
  margin-top:8px;
  font:5.5px Arial,sans-serif;
  letter-spacing:3px;
}
.titulo{
  margin-top:61px;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:45px;
  font-weight:500;
  line-height:.72;
  letter-spacing:-1.2px;
}
.titulo em{
  display:block;
  margin-top:6px;
  font-size:47px;
  font-style:italic;
}
.boton{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:21px;
  width:156px;
  height:43px;
  border:1px solid rgba(255,244,232,.9);
  border-radius:24px;
  background:rgba(30,8,6,.10);
  color:#fff6ec;
  text-decoration:none;
  font:500 15px "Cormorant Garamond",Georgia,serif;
  transition:.2s;
}
.boton:hover{background:rgba(255,255,255,.08);transform:translateY(-1px)}
.boton span{font:17px Arial,sans-serif}
button.boton{cursor:pointer;padding:0}
.fondo-pc{
  display:none;
  position:fixed;
  inset:-60px;
  z-index:0;
  background:center/cover no-repeat;
  filter:blur(30px) brightness(.45);
}
@media (min-width:700px){
  .hero{
    z-index:1;
    width:calc(max(100vh,600px)*.5);
    box-shadow:0 0 80px rgba(0,0,0,.65);
  }
  .fondo-pc{display:block}
}
.selector{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(23,11,9,.72);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.selector[hidden]{display:none}
.selector-caja{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  width:100%;
  max-width:300px;
  padding:34px 24px 30px;
  border:1px solid rgba(255,244,232,.35);
  border-radius:18px;
  background:rgba(30,8,6,.85);
  color:#f7eee4;
  text-align:center;
}
.selector-titulo{
  margin-bottom:6px;
  font:italic 500 26px "Cormorant Garamond",Georgia,serif;
}
.selector-caja .boton{margin-top:0;width:190px}
.selector-cerrar{
  position:absolute;
  top:8px;
  right:12px;
  border:0;
  background:none;
  color:#f7eee4;
  font:24px Arial,sans-serif;
  cursor:pointer;
  opacity:.75;
}
.selector-cerrar:hover{opacity:1}
.ubicacion{
  margin-top:59px;
  font:5.5px Arial,sans-serif;
  letter-spacing:2.2px;
}
</style>
</head>
