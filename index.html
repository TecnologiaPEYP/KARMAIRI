<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kar Mai Rí — Cocina & Tragos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#efe4cd;
    --cream-deep:#e6d8b9;
    --ink:#2c2115;
    --ink-soft:#4a3a26;
    --terracotta:#a8532f;
    --terracotta-deep:#8e4326;
    --terracotta-line:#c98a5f;
    --gold:#c79a4b;
    --cream-line:#8d7a52;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Cormorant Garamond', serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    height:100vh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(199,154,75,0.16), transparent 55%),
      radial-gradient(ellipse at 80% 85%, rgba(168,83,47,0.12), transparent 55%),
      var(--cream);
    color:var(--ink);
  }
  .frame{
    position:absolute;
    inset:18px;
    border:1px solid rgba(44,33,21,0.35);
    pointer-events:none;
  }
  .panel{
    position:relative;
    text-align:center;
    text-decoration:none;
    color:inherit;
    padding:0 8%;
  }
  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:clamp(0.85rem, 1vw, 1.05rem);
    letter-spacing:0.12em;
    opacity:0.72;
    margin-bottom:0.6rem;
  }
  .panel-title{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(2.6rem, 6.4vw, 5.2rem);
    line-height:0.98;
    letter-spacing:-0.01em;
  }
  .panel-sub{
    margin-top:1.1rem;
    font-size:clamp(1.05rem, 1.3vw, 1.3rem);
    font-style:italic;
    opacity:0.8;
    max-width:32ch;
    margin-left:auto;
    margin-right:auto;
    line-height:1.35;
  }
  .enter{
    margin-top:2.2rem;
    display:inline-flex;
    align-items:center;
    gap:0.55rem;
    font-size:0.95rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-family:'Cormorant Garamond', serif;
    padding-bottom:3px;
    border-bottom:1px solid currentColor;
    opacity:0.85;
    transition:opacity 0.3s ease;
  }
  .enter::after{
    content:'—';
    transition:margin-left 0.35s ease;
  }
  .panel:hover .enter::after{ margin-left:4px; }
  .panel:hover .enter{ opacity:1; }

  .seal{
    margin:0 auto 1.6rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:clamp(120px,13vw,168px);
    height:clamp(120px,13vw,168px);
    border-radius:50%;
    background:var(--cream);
    border:1px solid rgba(44,33,21,0.35);
    box-shadow:0 6px 30px rgba(44,33,21,0.25);
    text-align:center;
    padding:10px;
  }
  .seal-mark{
    font-family:'Playfair Display', serif;
    font-size:clamp(1.15rem,1.7vw,1.55rem);
    color:var(--ink);
    letter-spacing:0.02em;
    line-height:1.05;
  }
  .seal-mark i{ font-style:italic; font-weight:500; display:block; font-size:0.62em; color:var(--terracotta-deep); }

  footer{
    position:fixed;
    bottom:16px;
    left:0; right:0;
    text-align:center;
    font-size:0.72rem;
    letter-spacing:0.14em;
    color:rgba(44,33,21,0.4);
    z-index:1;
    pointer-events:none;
  }

  @media (max-width: 720px){
    .panel-content{ padding:0 10%; }
    .seal{ width:100px; height:100px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="frame"></div>
  <a class="panel" href="MENU%20KARMAIRI-10-09-2026.pdf" target="_blank" rel="noopener">
    <div class="seal">
      <div class="seal-mark">Kar Mai Rí<i>cocina & tragos</i></div>
    </div>
    <div class="eyebrow">Kar Mai Rí</div>
    <div class="panel-title">Menú</div>
    <p class="panel-sub">Sabores del Caribe y coctelería, de mar a mesa</p>
    <span class="enter">Ver menú</span>
  </a>
</div>

<footer>Centro Histórico · Cartagena de Indias</footer>

</body>
</html>
